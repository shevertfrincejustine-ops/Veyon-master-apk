
name: Veyon Android SDK NDK Setup

on:
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Veyon 4.11.4
        uses: actions/checkout@v4
        with:
          repository: veyon/veyon
          ref: v4.11.4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-29" \
            "build-tools;29.0.2" \
            "ndk;21.4.7075529"

      - name: Prepare Veyon Android paths
        run: |
          sudo mkdir -p /opt/android
          sudo ln -sfn "$ANDROID_SDK_ROOT" /opt/android/sdk
          sudo ln -sfn "$ANDROID_SDK_ROOT/ndk/21.4.7075529" /opt/android/ndk

      - name: Verify Android SDK and NDK
        run: |
          echo "=== ANDROID SDK ==="
          ls -la /opt/android/sdk
          echo "=== ANDROID NDK ==="
          ls -la /opt/android/ndk
          echo "=== NDK VERSION ==="
          cat /opt/android/ndk/source.properties
          
