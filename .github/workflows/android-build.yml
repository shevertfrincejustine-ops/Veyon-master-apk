
name: Veyon Android Build Preparation

on:
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Veyon 4.11.4
        uses: actions/checkout@v4
        with:
          repository: veyon/veyon
          ref: v4.11.4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            wget \
            unzip \
            openjdk-8-jdk

      - name: Check Android build requirements
        run: |
          echo "=== JAVA ==="
          java -version

          echo "=== CMAKE ==="
          cmake --version

          echo "=== ANDROID FILES ==="
          ls -la .ci/android.arm64-v8a/
          ls -la android/

          echo "=== TOOLCHAIN ==="
          cat cmake/modules/AndroidToolchain.cmake

          echo "=== QT REQUIREMENTS ==="
          grep -n -E 'WITH_QT6|find_package\(Qt5|Qca|OpenSSL' CMakeLists.txt

      - name: Check Android SDK and NDK
        run: |
          for path in /opt/android/sdk /opt/android/ndk; do
            if [ -d "$path" ]; then
              echo "FOUND: $path"
            else
              echo "MISSING: $path"
            fi
          done

      - name: Upload preparation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyon-android-preparation
          path: |
            CMakeLists.txt
            
